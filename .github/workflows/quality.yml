name: AgentGuard quality gate

on:
  push:
  pull_request:

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run eval:gate
      - run: npx tsc --noEmit
